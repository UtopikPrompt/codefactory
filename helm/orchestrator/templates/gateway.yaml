{{/*
Gateway Deployment + Service for the task-acceptor.
Faithful to the thinktank design: the task-acceptor is now its own
always-on Deployment, independent of the supervisor loop.
*/}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    app: orchestrator
    component: gateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: orchestrator
      component: gateway
  template:
    metadata:
      labels:
        app: orchestrator
        component: gateway
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: {{ .Chart.Name }}-gateway
      securityContext:
        runAsUser: 1001
        runAsNonRoot: true
        fsGroup: 1001
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: gateway
          image: {{ .Values.gateway.image | default "ghcr.io/utopikprompt/codefactory-gateway:latest" }}
          imagePullPolicy: {{ .Values.gateway.imagePullPolicy | default "Always" }}
          ports:
            - name: gateway
              containerPort: 8000
            - name: metrics
              containerPort: 9000
          volumeMounts:
            - name: task-state
              mountPath: /data/tasks
            - name: github-app-key
              mountPath: /etc/github-app
              readOnly: true
          env:
            - name: GITHUB_OIDC_AUDIENCE
              value: {{ .Values.githubAuth.audience | quote }}
            - name: GITHUB_APP_ID
              value: {{ .Values.githubAuth.appId | quote }}
            - name: GITHUB_APP_PRIVATE_KEY_FILE
              value: /etc/github-app/private-key.pem
            - name: GITHUB_REPOSITORY_POLICIES
              value: {{ .Values.githubAuth.repositories | toJson | quote }}
            {{- with .Values.githubAuth.workflowPolicy }}
            - name: GITHUB_WORKFLOW_POLICY
              value: {{ . | toJson | quote }}
            {{- end }}
            {{- if .Values.management.enabled }}
            - name: MANAGEMENT_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretRefs.managementServiceToken.name | quote }}
                  key: {{ .Values.secretRefs.managementServiceToken.key | quote }}
            {{- end }}
            - name: SUPERVISOR_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretRefs.supervisorServiceToken.name | quote }}
                  key: {{ .Values.secretRefs.supervisorServiceToken.key | quote }}
            - name: GATEWAY_TRANSPORT_MODE
              value: {{ .Values.gateway.transportMode | quote }}
            - name: TASK_CREDENTIAL_TTL_SECONDS
              value: {{ .Values.gateway.taskCredentialTtlSeconds | quote }}
            - name: TASK_DB_PATH
              value: /data/tasks/tasks.sqlite3
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: AGENT_CONFIG_VERSION
              value: {{ .Values.agentCatalog.version | default "1" | quote }}
            - name: AGENT_CONFIG_HASH
              value: {{ include "orchestrator.agentCatalogHash" . | quote }}
          resources:
            requests:
              cpu: {{ .Values.gateway.config.cpuRequest | default "100m" }}
              memory: {{ .Values.gateway.config.memory | default "256Mi" }}
            limits:
              cpu: {{ .Values.gateway.config.cpuLimit | default "250m" }}
              memory: {{ .Values.gateway.config.memoryLimit | default "512Mi" }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: gateway
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: gateway
            periodSeconds: 15
      volumes:
        - name: github-app-key
          secret:
            secretName: {{ .Values.secretRefs.githubAppKey.name | quote }}
            defaultMode: 0440
            items:
              - key: {{ .Values.secretRefs.githubAppKey.key | quote }}
                path: private-key.pem
        - name: task-state
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-task-state" .Chart.Name) .Values.gateway.persistence.existingClaim }}
{{- if not .Values.gateway.persistence.existingClaim }}
{{- if .Values.gateway.persistence.pv.create }}
{{- if ne .Values.gateway.persistence.volumeName .Values.gateway.persistence.pv.name }}
{{- fail "gateway.persistence.volumeName must match pv.name" }}
{{- end }}
{{- $path := .Values.gateway.persistence.pv.path }}
{{- if or (ne (clean $path) $path) (contains "/../" $path) (hasSuffix "/.." $path) }}
{{- fail "gateway.persistence.pv.path must be an absolute normalized dedicated directory" }}
{{- end }}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Values.gateway.persistence.pv.name }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  capacity:
    storage: {{ .Values.gateway.persistence.size | quote }}
  volumeMode: Filesystem
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Delete
  storageClassName: ""
  local:
    path: {{ .Values.gateway.persistence.pv.path | quote }}
  claimRef:
    namespace: {{ .Release.Namespace }}
    name: {{ .Chart.Name }}-task-state
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchFields:
            - key: metadata.name
              operator: In
              values: [{{ .Values.gateway.persistence.pv.nodeName | quote }}]
{{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Chart.Name }}-task-state
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  accessModes: [{{ .Values.gateway.persistence.accessMode | default "ReadWriteMany" }}]
  {{- if or .Values.gateway.persistence.pv.create .Values.gateway.persistence.storageClassName .Values.gateway.persistence.volumeName }}
  storageClassName: {{ .Values.gateway.persistence.storageClassName | quote }}
  {{- end }}
  {{- with .Values.gateway.persistence.volumeName }}
  volumeName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.gateway.persistence.size | quote }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}-orchestrator-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    app: orchestrator
    component: gateway
spec:
  selector:
    app: orchestrator
    component: gateway
  ports:
    - name: task-acceptor
      port: 8000
      targetPort: 8000
    - name: metrics
      port: 9000
      targetPort: 9000
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Chart.Name }}-gateway
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Chart.Name }}-gateway
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Chart.Name }}-gateway
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .Chart.Name }}-gateway
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Chart.Name }}-gateway
