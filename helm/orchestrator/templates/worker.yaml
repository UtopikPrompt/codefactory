{{/*
Worker configuration and mutable Job spec; the supervisor creates one Job per task.
*/}}
{{- $judgeUrl := index .Values.supervisor.config "judge-url" -}}
{{- $coderUrl := index .Values.supervisor.config "coder-url" -}}
{{- $coderNative := eq $coderUrl "http://inference-p40.inference-dev.svc.cluster.local:8000/v1" -}}
{{- $judgeNative := eq $judgeUrl "http://inference-cpu.inference-dev.svc.cluster.local:8000/v1" -}}
{{- if kindIs "bool" .Values.worker.coderNativeDownload -}}
{{- $coderNative = .Values.worker.coderNativeDownload -}}
{{- end -}}
{{- if kindIs "bool" .Values.worker.judgeNativeDownload -}}
{{- $judgeNative = .Values.worker.judgeNativeDownload -}}
{{- end -}}
{{- $m := dict
  "max-iterations" (int (default (index .Values.supervisor.config "max-iterations") 8))
  "task-wait-seconds" (int (default (index .Values.supervisor.config "task-wait-seconds") 30))
  "loop-state-dir" (default (index .Values.supervisor.config "loop-state-dir") "/data/loop-state")
  "acceptor-url" (required "supervisor.config.acceptor-url must be a trusted HTTPS gateway origin" (index .Values.supervisor.config "acceptor-url"))
  "judge-url" $judgeUrl
  "judge-model" (default "Qwen/Qwen2.5-Coder-7B-Instruct-GGUF:Q4_K_M" (index .Values.supervisor.config "judge-model"))
  "coder-url" $coderUrl
  "coder-model" (default "Qwen/Qwen2.5-Coder-7B-Instruct-GGUF:Q4_K_M" (index .Values.supervisor.config "coder-model"))
  "worker-roles" (index .Values.worker "worker-roles")
-}}
{{- $workerJobSpec := dict
  "suspend" true
  "parallelism" 2
  "completions" 8
  "backoffLimit" 0
  "activeDeadlineSeconds" 900
  "ttlSecondsAfterFinished" 900
  "template" (dict
    "metadata" (dict "labels" (dict "app" "orchestrator" "component" "worker"))
    "spec" (dict
      "restartPolicy" "Never"
      "automountServiceAccountToken" false
      "securityContext" (dict "runAsUser" 1001 "runAsNonRoot" true "fsGroup" 1001)
      "containers" (list (dict
        "name" "coder"
        "image" (.Values.worker.image | default "ghcr.io/utopikprompt/codefactory-worker:latest")
        "imagePullPolicy" (.Values.worker.imagePullPolicy | default "IfNotPresent")
        "volumeMounts" (list
          (dict "name" "workspace" "mountPath" "/data/task-work")
          (dict "name" "loop-state" "mountPath" "/data/loop-state"))
        "env" (list
          (dict "name" "CODER_API_KEY" "valueFrom" (dict "secretKeyRef" (dict
            "name" (.Values.secretRefs.coderApiKey.name | default "codefactory-coder-api-key")
            "key" .Values.secretRefs.coderApiKey.key "optional" true)))
          (dict "name" "ACCEPTOR_URL" "valueFrom" (dict "configMapKeyRef" (dict
            "name" (printf "%s-config" .Chart.Name) "key" "acceptor-url")))
          (dict "name" "CODER_URL" "value" $coderUrl)
          (dict "name" "CODER_MODEL" "value" (index $m "coder-model"))
          (dict "name" "CODER_NATIVE_DOWNLOAD" "value" ($coderNative | toString))
          (dict "name" "WORKER_ROLE" "value" "coder")
          (dict "name" "AGENT_CONFIG_VERSION" "value" (.Values.agentCatalog.version | default "1" | toString))
          (dict "name" "AGENT_CONFIG_HASH" "value" (include "orchestrator.agentCatalogHash" .))
          (dict "name" "TASK_REPO_POLICIES" "value" (.Values.worker.repoPolicies | toJson)))
        "resources" (dict
          "requests" (dict "cpu" (.Values.supervisor.config.cpuRequest | default "500m")
                           "memory" (.Values.supervisor.config.memory | default "2Gi"))
          "limits" (dict "cpu" (.Values.supervisor.config.cpuLimit | default "2500m")
                         "memory" (.Values.supervisor.config.memoryLimit | default "5Gi")))
        "ports" (list (dict "name" "metrics" "containerPort" 9000))))
      "volumes" (list
        (dict "name" "workspace" "emptyDir" (dict "sizeLimit" "512Mi"))
        (dict "name" "loop-state" "emptyDir" (dict)))
      "imagePullSecrets" .Values.imagePullSecrets))
-}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    app: orchestrator
    app.kubernetes.io/managed-by: Helm
  annotations:
    created-by: helm
data:
  {{- range $k, $v := $m }}
  {{ $k }}: {{ $v | quote }}
  {{ end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-worker
  namespace: {{ .Release.Namespace }}
  labels:
    app: orchestrator
    component: worker-template
    app.kubernetes.io/managed-by: Helm
data:
  job-spec.json: {{ $workerJobSpec | toJson | quote }}
