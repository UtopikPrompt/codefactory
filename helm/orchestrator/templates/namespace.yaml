{{- if and .Values.namespaces.create (not (lookup "v1" "Namespace" "" .Release.Namespace)) }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/part-of: {{ .Chart.Name }}
    app.kubernetes.io/component: orchestrator
{{- end }}
