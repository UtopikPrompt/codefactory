name: CI Pipeline

on:
  push:
    branches: [main]
    tags: ["v*", "[0-9]*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_PATH: orchestrator/
  TEST_PATH_FORMAT: orchestrator/{0}
  TEST_REQUIREMENTS_FORMAT: orchestrator/{0}/requirements-test.txt
  CHART_PATH: helm/orchestrator
  CHART_RELEASE: orchestrator
  CHART_DEPENDENCIES: "false"
  CHART_REPOSITORY_NAME: ""
  CHART_REPOSITORY_URL: ""
  CHART_STRICT: "false"
  CHART_VALUES_FILE: helm/orchestrator/example.values.yaml
  CHART_SET_VALUES: management.enabled=true
  CHART_EXPECTED_IMAGES: |
    ghcr.io/utopikprompt/codefactory-gateway:latest
    ghcr.io/utopikprompt/codefactory-management:latest
    ghcr.io/utopikprompt/codefactory-supervisor:latest
    ghcr.io/utopikprompt/codefactory-worker:latest
  REGISTRY: ghcr.io
  PUBLISH_IMAGES: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.GHCR_PUBLISH_ENABLED == 'true' }}

jobs:
  lint:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        shell: bash
        run: python -m pip install ruff

      - name: Run linting
        shell: bash
        run: ruff check "$PYTHON_PATH"

  test:
    name: test-${{ matrix.slice }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        slice: [supervisor, worker, gateway, management, shared]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Prepare Helm dependencies
        shell: bash
        run: |
          if [[ "$CHART_DEPENDENCIES" == true ]]; then
            helm repo add "$CHART_REPOSITORY_NAME" "$CHART_REPOSITORY_URL"
            helm dependency build "$CHART_PATH"
          fi

      - name: Install dependencies
        env:
          TEST_REQUIREMENTS: ${{ format(env.TEST_REQUIREMENTS_FORMAT, matrix.slice) }}
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "$TEST_REQUIREMENTS"

      - name: Run tests
        id: pytest
        env:
          TEST_PATH: ${{ format(env.TEST_PATH_FORMAT, matrix.slice) }}
        shell: bash
        run: |
          mkdir -p test-results
          pytest "$TEST_PATH" -v -ra --durations=10 --junitxml=test-results/pytest.xml

      - name: Summarize test results
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.pytest.outcome }}
          TEST_ARTIFACT: ${{ format('python-test-results-{0}', matrix.slice) }}
        shell: python
        run: |
          import html
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          def label(value):
            return html.escape(str(value)).replace("|", "&#124;").replace("\n", " ")[:240]

          report = Path("test-results/pytest.xml")
          lines = ["## Python Test Results", "", f"Test step: **{label(os.environ['TEST_OUTCOME'])}**", ""]
          if not report.exists():
            lines.append("No test report was produced. Check dependency installation and test-step logs.")
          else:
            suites = list(ET.parse(report).getroot().iter("testsuite"))
            totals = {key: sum(int(suite.get(key, "0")) for suite in suites)
                for key in ("tests", "failures", "errors", "skipped")}
            passed = totals["tests"] - totals["failures"] - totals["errors"] - totals["skipped"]
            elapsed = sum(float(suite.get("time", "0")) for suite in suites)
            lines += ["| Total | Passed | Failed | Errors | Skipped | Duration |",
                "| --- | --- | --- | --- | --- | --- |",
                f"| {totals['tests']} | {passed} | {totals['failures']} | {totals['errors']} | {totals['skipped']} | {elapsed:.2f}s |",
                "", "### Results by Module", "",
                "| Module | Tests | Failed / Errors | Skipped |", "| --- | --- | --- | --- |"]
            cases = [case for suite in suites for case in suite.findall("testcase")]
            modules = {}
            for case in cases:
              module = case.get("classname", "unknown")
              counts = modules.setdefault(module, [0, 0, 0])
              counts[0] += 1
              counts[1] += int(case.find("failure") is not None or case.find("error") is not None)
              counts[2] += int(case.find("skipped") is not None)
            for module, counts in sorted(modules.items()):
              lines.append(f"| {label(module)} | {counts[0]} | {counts[1]} | {counts[2]} |")
            lines += ["", "### Slowest Tests", "", "| Test | Duration |", "| --- | --- |"]
            for case in sorted(cases, key=lambda case: float(case.get("time", "0")), reverse=True)[:10]:
              name = label(case.get("classname", "") + "::" + case.get("name", ""))
              lines.append(f"| {name} | {float(case.get('time', '0')):.2f}s |")
            issues = [(case, detail) for case in cases for detail in case
                if detail.tag in ("failure", "error", "skipped")]
            if issues:
              lines += ["", "### Failures, Errors, and Skips", "",
                  "| Test | Result | Reason |", "| --- | --- | --- |"]
              for case, detail in issues[:30]:
                name = label(case.get("classname", "") + "::" + case.get("name", ""))
                lines.append(f"| {name} | {label(detail.tag)} | {label(detail.get('message', 'See XML report'))} |")
              if len(issues) > 30:
                lines += ["", f"Showing 30 of {len(issues)} results; see the XML artifact for the rest."]
            lines += ["", f"Full results are available in the **{label(os.environ['TEST_ARTIFACT'])}** artifact on this run."]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
            summary.write("\n".join(lines) + "\n")

      - name: Upload test results
        if: always() && hashFiles('test-results/pytest.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ format('python-test-results-{0}', matrix.slice) }}
          path: test-results/pytest.xml
          retention-days: 14

  chart-validation:
    name: Validate Helm chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Prepare Helm dependencies
        shell: bash
        run: |
          if [[ "$CHART_DEPENDENCIES" == true ]]; then
            helm repo add "$CHART_REPOSITORY_NAME" "$CHART_REPOSITORY_URL"
            helm dependency build "$CHART_PATH"
          fi

      - name: Lint and render Helm chart
        shell: bash
        run: |
          values_args=()
          [[ -z "$CHART_VALUES_FILE" ]] || values_args+=(--values "$CHART_VALUES_FILE")
          lint_args=()
          [[ "$CHART_STRICT" != true ]] || lint_args+=(--strict)
          helm lint "$CHART_PATH" "${lint_args[@]}" "${values_args[@]}"
          render_args=()
          while IFS= read -r setting; do
            [[ -z "$setting" ]] || render_args+=(--set "$setting")
          done <<< "$CHART_SET_VALUES"
          rendered="$(helm template "$CHART_RELEASE" "$CHART_PATH" \
            --namespace "$CHART_RELEASE" "${values_args[@]}" "${render_args[@]}")"
          while IFS= read -r image; do
            [[ -n "$image" ]] || continue
            grep -Fq "$image" <<< "$rendered" || {
              echo "Expected image missing from chart render: $image" >&2
              exit 1
            }
          done <<< "$CHART_EXPECTED_IMAGES"

  publish-chart:
    name: Publish Helm chart
    if: >-
      ${{
        success() &&
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) &&
        vars.HELM_CHART_PUBLISH_ENABLED == 'true'
      }}
    needs: [lint, test, chart-validation]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      CHART_NAME: orchestrator
      CHART_OCI_REPOSITORY: ghcr.io/utopikprompt/codefactory
      CHART_ALIAS: dev
    steps:
      - name: Select chart version
        id: chart-version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid source commit" >&2
            exit 1
          fi
          source_version="0.0.0-sha.${GITHUB_SHA}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            chart_version="${GITHUB_REF#refs/tags/}"
            chart_version="${chart_version#v}"
            if [[ ! "$chart_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "Release tag must be vMAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH" >&2
              exit 1
            fi
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            chart_version="$source_version"
          else
            echo "Unsupported chart publication ref: $GITHUB_REF" >&2
            exit 1
          fi
          echo "package_version=$chart_version" >> "$GITHUB_OUTPUT"
          echo "source_version=$source_version" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Prepare Helm dependencies
        shell: bash
        run: |
          if [[ "$CHART_DEPENDENCIES" == true ]]; then
            helm repo add "$CHART_REPOSITORY_NAME" "$CHART_REPOSITORY_URL"
            helm dependency build "$CHART_PATH"
          fi

      - name: Set up ORAS
        uses: oras-project/setup-oras@v1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install chart metadata tool
        shell: bash
        run: python -m pip install "PyYAML>=6,<7"

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          echo "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Package and publish chart
        env:
          PACKAGE_VERSION: ${{ steps.chart-version.outputs.package_version }}
          SOURCE_CHART_VERSION: ${{ steps.chart-version.outputs.source_version }}
          SOURCE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          chart_source="$RUNNER_TEMP/chart-source"
          package_dir="$RUNNER_TEMP/chart-package"
          mkdir -p "$package_dir"
          cp -a "$CHART_PATH" "$chart_source"
          python - "$chart_source/Chart.yaml" "$SOURCE_COMMIT" <<'PY'
          import sys
          from pathlib import Path
          import yaml

          chart_path = Path(sys.argv[1])
          chart = yaml.safe_load(chart_path.read_text(encoding="utf-8"))
          chart.setdefault("annotations", {})["org.opencontainers.image.revision"] = sys.argv[2]
          chart_path.write_text(yaml.safe_dump(chart, sort_keys=False), encoding="utf-8")
          PY

          chart_ref="oci://$CHART_OCI_REPOSITORY/$CHART_NAME"
          publish_chart() {
            local version="$1"
            local kind="$2"
            local package_version="$version"
            local existing_dir="$RUNNER_TEMP/existing-$version"
            local pull_log="$RUNNER_TEMP/pull-$version.log"
            mkdir -p "$existing_dir"
            if helm pull "$chart_ref" --version "$version" --destination "$existing_dir" >"$pull_log" 2>&1; then
              if [[ "$kind" == release ]]; then
                echo "Refusing to overwrite existing released chart version $version" >&2
                exit 1
              fi
              local existing_chart="$existing_dir/$CHART_NAME-$version.tgz"
              local existing_commit
              existing_commit="$(helm show chart "$existing_chart" | python -c 'import sys,yaml; print(yaml.safe_load(sys.stdin).get("annotations", {}).get("org.opencontainers.image.revision", ""))')"
              if [[ "$existing_commit" != "$SOURCE_COMMIT" ]]; then
                echo "Existing source chart $version does not map to $SOURCE_COMMIT" >&2
                exit 1
              fi
              echo "Source chart $version already maps to $SOURCE_COMMIT; keeping it unchanged"
              return
            fi
            if ! grep -Eqi 'not found|manifest unknown|404' "$pull_log"; then
              cat "$pull_log" >&2
              echo "Could not safely determine whether chart version $version already exists" >&2
              exit 1
            fi
            helm package "$chart_source" --version "$package_version" --destination "$package_dir"
            helm push "$package_dir/$CHART_NAME-$package_version.tgz" "oci://$CHART_OCI_REPOSITORY"
          }
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            publish_chart "$PACKAGE_VERSION" release
          fi
          publish_chart "$SOURCE_CHART_VERSION" source

          source_chart_dir="$RUNNER_TEMP/source-chart"
          mkdir -p "$source_chart_dir"
          pull_output="$(helm pull "$chart_ref" --version "$SOURCE_CHART_VERSION" --destination "$source_chart_dir" 2>&1)"
          chart_digest="$(sed -n 's/^Digest: //p' <<< "$pull_output")"
          if [[ ! "$chart_digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Could not determine exact published source chart digest" >&2
            exit 1
          fi
          source_package="$source_chart_dir/$CHART_NAME-$SOURCE_CHART_VERSION.tgz"
          source_revision="$(helm show chart "$source_package" | python -c 'import sys,yaml; print(yaml.safe_load(sys.stdin).get("annotations", {}).get("org.opencontainers.image.revision", ""))')"
          if [[ "$source_revision" != "$SOURCE_COMMIT" ]]; then
            echo "Published source chart does not match the requested source commit" >&2
            exit 1
          fi
          source_ref="$CHART_OCI_REPOSITORY/$CHART_NAME:$SOURCE_CHART_VERSION"
          if [[ "$(oras resolve "$source_ref")" != "$chart_digest" ]]; then
            echo "Published source chart digest does not match the registry digest" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            oras tag "$CHART_OCI_REPOSITORY/$CHART_NAME@$chart_digest" "$CHART_ALIAS"
          fi
          {
            printf 'Published immutable chart version: `%s`\n\n' "$PACKAGE_VERSION"
            printf 'Source chart version: `%s`\n\n' "$SOURCE_CHART_VERSION"
            printf 'Source digest: `%s`\n' "$chart_digest"
          } >> "$GITHUB_STEP_SUMMARY"

  set-image-tag:
    name: Select image tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Set image tag
        id: tag
        shell: bash
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build-images:
    name: Build container images
    needs: [lint, test, chart-validation, set-image-tag]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [supervisor, worker, gateway, management]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: env.PUBLISH_IMAGES == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./orchestrator/${{ matrix.service }}
          push: ${{ env.PUBLISH_IMAGES == 'true' }}
          tags: |
            ${{ env.REGISTRY }}/utopikprompt/codefactory-${{ matrix.service }}:dev
            ${{ env.REGISTRY }}/utopikprompt/codefactory-${{ matrix.service }}:${{ needs.set-image-tag.outputs.tag }}
            ${{ env.REGISTRY }}/utopikprompt/codefactory-${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/utopikprompt/codefactory-${{ matrix.service }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}

  summary:
    name: CI Summary
    if: always()
    needs:
      [lint, test, chart-validation, publish-chart, set-image-tag, build-images]
    runs-on: ubuntu-latest
    steps:
      - name: Summarize pipeline
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          SOURCE_COMMIT: ${{ github.sha }}
        shell: python
        run: |
          import json
          import os

          results = json.loads(os.environ["JOB_RESULTS"])
          lines = ["## CI Overview", "", "| Job | Result |", "| --- | --- |"]
          for job, details in results.items():
              lines.append(f"| {job} | {details['result']} |")
          lines += ["", f"Commit: `{os.environ['SOURCE_COMMIT']}`", "",
              f"[Run logs and artifacts]({os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']})",
              "", "Publication is opt-in; skipped publication jobs did not publish artifacts."]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
