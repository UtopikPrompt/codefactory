name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  PUBLISH_IMAGES: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.GHCR_PUBLISH_ENABLED == 'true' }}

jobs:
  set-image-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Set image tag
        id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run linting
        run: ruff check orchestrator/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Helm for chart regressions
        uses: azure/setup-helm@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the full union of runtime dependencies declared in each
          # sub-package requirements file (supervisor/worker/gateway/management).
          # This guarantees prometheus_client, pydantic, langchain-core,
          # langchain-sdk, tenacity, fastapi, uvicorn, httpx, openai, etc.
          pip install -r orchestrator/supervisor/requirements.txt \
            -r orchestrator/worker/requirements.txt \
            -r orchestrator/gateway/requirements.txt \
            -r orchestrator/management/requirements.txt
          # pytest is not part of any requirements file, so install it
          # separately to guarantee the `pytest` binary is on PATH.
          pip install pytest

      - name: Run tests
        id: pytest
        run: |
          mkdir -p test-results
          pytest orchestrator/ -v -ra --durations=10 --junitxml=test-results/pytest.xml

      - name: Summarize test results
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.pytest.outcome }}
        shell: python
        run: |
          import html
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          def label(value):
            return html.escape(str(value)).replace("|", "&#124;").replace("\n", " ")[:240]

          report = Path("test-results/pytest.xml")
          lines = ["## Python Test Results", "", f"Test step: **{label(os.environ['TEST_OUTCOME'])}**", ""]
          if not report.exists():
            lines.append("No test report was produced. Check dependency installation and test-step logs.")
          else:
            suites = list(ET.parse(report).getroot().iter("testsuite"))
            totals = {key: sum(int(suite.get(key, "0")) for suite in suites)
                for key in ("tests", "failures", "errors", "skipped")}
            passed = totals["tests"] - totals["failures"] - totals["errors"] - totals["skipped"]
            elapsed = sum(float(suite.get("time", "0")) for suite in suites)
            lines += ["| Total | Passed | Failed | Errors | Skipped | Duration |",
                "| --- | --- | --- | --- | --- | --- |",
                f"| {totals['tests']} | {passed} | {totals['failures']} | {totals['errors']} | {totals['skipped']} | {elapsed:.2f}s |",
                "", "### Results by Module", "",
                "| Module | Tests | Failed / Errors | Skipped |", "| --- | --- | --- | --- |"]
            cases = [case for suite in suites for case in suite.findall("testcase")]
            modules = {}
            for case in cases:
              module = case.get("classname", "unknown")
              counts = modules.setdefault(module, [0, 0, 0])
              counts[0] += 1
              counts[1] += int(case.find("failure") is not None or case.find("error") is not None)
              counts[2] += int(case.find("skipped") is not None)
            for module, counts in sorted(modules.items()):
              lines.append(f"| {label(module)} | {counts[0]} | {counts[1]} | {counts[2]} |")
            lines += ["", "### Slowest Tests", "", "| Test | Duration |", "| --- | --- |"]
            for case in sorted(cases, key=lambda case: float(case.get("time", "0")), reverse=True)[:10]:
              name = label(case.get("classname", "") + "::" + case.get("name", ""))
              lines.append(f"| {name} | {float(case.get('time', '0')):.2f}s |")
            issues = [(case, detail) for case in cases for detail in case
                if detail.tag in ("failure", "error", "skipped")]
            if issues:
              lines += ["", "### Failures, Errors, and Skips", "",
                  "| Test | Result | Reason |", "| --- | --- | --- |"]
              for case, detail in issues[:30]:
                name = label(case.get("classname", "") + "::" + case.get("name", ""))
                lines.append(f"| {name} | {label(detail.tag)} | {label(detail.get('message', 'See XML report'))} |")
              if len(issues) > 30:
                lines += ["", f"Showing 30 of {len(issues)} results; see the XML artifact for the rest."]
            lines += ["", "Full results are available in the **python-test-results** artifact on this run."]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
            summary.write("\n".join(lines) + "\n")

      - name: Upload test results
        if: always() && hashFiles('test-results/pytest.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: python-test-results
          path: test-results/pytest.xml
          retention-days: 14

  chart-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint and render orchestrator chart
        run: |
          helm lint helm/orchestrator --values helm/orchestrator/example.values.yaml
          rendered="$(helm template orchestrator helm/orchestrator \
            --namespace orchestrator \
            --values helm/orchestrator/example.values.yaml \
            --set management.enabled=true)"
          for image in \
            ghcr.io/utopikprompt/codefactory-gateway:latest \
            ghcr.io/utopikprompt/codefactory-management:latest \
            ghcr.io/utopikprompt/codefactory-supervisor:latest \
            ghcr.io/utopikprompt/codefactory-worker:latest; do
            grep -Fq "$image" <<< "$rendered" || {
              echo "Expected image missing from chart render: $image" >&2
              exit 1
            }
          done

  publish-orchestrator-chart:
    name: Publish orchestrator Helm chart
    if: >-
      ${{
        success() &&
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        github.ref == 'refs/heads/main' &&
        vars.HELM_CHART_PUBLISH_ENABLED == 'true'
      }}
    needs: [lint, test, chart-validation]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      chart_digest: ${{ steps.package-and-push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up ORAS
        uses: oras-project/setup-oras@v1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install chart metadata tool
        run: python -m pip install "PyYAML>=6,<7"

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          echo "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Package and push chart
        id: package-and-push
        shell: bash
        run: |
          set -euo pipefail
          package_version="0.0.0-sha.${GITHUB_SHA}"
          chart_source="$RUNNER_TEMP/chart-source"
          cp -a helm/orchestrator "$chart_source"
          python - "$chart_source/Chart.yaml" "$GITHUB_SHA" <<'PY'
          import sys
          from pathlib import Path
          import yaml

          chart_path = Path(sys.argv[1])
          chart = yaml.safe_load(chart_path.read_text(encoding="utf-8"))
          chart.setdefault("annotations", {})["org.opencontainers.image.revision"] = sys.argv[2]
          chart_path.write_text(yaml.safe_dump(chart, sort_keys=False), encoding="utf-8")
          PY
          helm package "$chart_source" --version "$package_version" --destination "$RUNNER_TEMP"
          package="$(find "$RUNNER_TEMP" -maxdepth 1 -type f -name 'orchestrator-*.tgz' -print -quit)"
          if [[ -z "$package" ]]; then
            echo "Packaged orchestrator chart not found" >&2
            exit 1
          fi
          chart_ref="oci://ghcr.io/utopikprompt/codefactory/orchestrator"
          existing_dir="$RUNNER_TEMP/existing-chart"
          pull_log="$RUNNER_TEMP/existing-chart-pull.log"
          mkdir -p "$existing_dir"
          if helm pull "$chart_ref" --version "$package_version" --destination "$existing_dir" >"$pull_log" 2>&1; then
            echo "Refusing to overwrite existing commit-addressed chart version $package_version" >&2
            exit 1
          fi
          if ! grep -Eqi 'not found|manifest unknown|404' "$pull_log"; then
            cat "$pull_log" >&2
            echo "Could not safely determine whether chart version $package_version exists" >&2
            exit 1
          fi
          push_output="$RUNNER_TEMP/helm-push-output.txt"
          helm push "$package" oci://ghcr.io/utopikprompt/codefactory | tee "$push_output"
          digest="$(sed -n 's/^Digest: //p' "$push_output")"
          if [[ ! "$digest" =~ ^sha256:[[:xdigit:]]{64}$ ]]; then
            echo "Helm push did not return a valid chart digest" >&2
            exit 1
          fi
          oras tag "ghcr.io/utopikprompt/codefactory/orchestrator:$package_version" main
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"
          {
            printf 'Published immutable chart version: `%s`\n\n' "$package_version"
            printf 'Digest: `%s`\n' "$digest"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write exact chart manifest
        env:
          CHART_DIGEST: ${{ steps.package-and-push.outputs.digest }}
          CHART_VERSION: ${{ steps.package-and-push.outputs.version }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = {
              "sourceCommit": os.environ["SOURCE_COMMIT"],
              "chart": "oci://ghcr.io/utopikprompt/codefactory/orchestrator",
              "chartVersion": os.environ["CHART_VERSION"],
              "chartDigest": os.environ["CHART_DIGEST"],
          }
          Path(os.environ["RUNNER_TEMP"], "codefactory-chart.json").write_text(
              json.dumps(manifest, sort_keys=True) + "\n", encoding="utf-8",
          )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: codefactory-chart-${{ github.sha }}
          path: ${{ runner.temp }}/codefactory-chart.json
          if-no-files-found: error
          retention-days: 90

  build-images:
    needs: [lint, test, chart-validation, set-image-tag]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [supervisor, worker, gateway, management]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: env.PUBLISH_IMAGES == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build-image
        uses: docker/build-push-action@v7
        with:
          context: ./orchestrator/${{ matrix.service }}
          push: ${{ env.PUBLISH_IMAGES == 'true' }}
          tags: |
            ${{ env.REGISTRY }}/utopikprompt/codefactory-${{ matrix.service }}:main
            ${{ env.REGISTRY }}/utopikprompt/codefactory-${{ matrix.service }}:${{ needs.set-image-tag.outputs.tag }}
            ${{ env.REGISTRY }}/utopikprompt/codefactory-${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/utopikprompt/codefactory-${{ matrix.service }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Write exact image manifest
        if: env.PUBLISH_IMAGES == 'true'
        env:
          IMAGE_DIGEST: ${{ steps.build-image.outputs.digest }}
          IMAGE_SERVICE: ${{ matrix.service }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf '{"sourceCommit":"%s","service":"%s","image":"ghcr.io/utopikprompt/codefactory-%s@%s"}\n' \
            "$SOURCE_COMMIT" "$IMAGE_SERVICE" "$IMAGE_SERVICE" "$IMAGE_DIGEST" \
            > "$RUNNER_TEMP/codefactory-image-${IMAGE_SERVICE}.json"

      - uses: actions/upload-artifact@v4
        if: env.PUBLISH_IMAGES == 'true'
        with:
          name: codefactory-image-${{ matrix.service }}
          path: ${{ runner.temp }}/codefactory-image-${{ matrix.service }}.json
          if-no-files-found: error
          retention-days: 90

  release-manifest:
    name: Assemble exact Code Factory release manifest
    if: >-
      ${{
        github.ref == 'refs/heads/main' &&
        vars.GHCR_PUBLISH_ENABLED == 'true' &&
        vars.HELM_CHART_PUBLISH_ENABLED == 'true' &&
        needs.publish-orchestrator-chart.result == 'success' &&
        needs.build-images.result == 'success'
      }}
    needs: [publish-orchestrator-chart, build-images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: codefactory-chart-${{ github.sha }}
          path: ${{ runner.temp }}/codefactory-manifests

      - uses: actions/download-artifact@v4
        with:
          pattern: codefactory-image-*
          path: ${{ runner.temp }}/codefactory-manifests
          merge-multiple: true

      - name: Assemble and validate complete product manifest
        env:
          MANIFEST_DIR: ${{ runner.temp }}/codefactory-manifests
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          directory = Path(os.environ["MANIFEST_DIR"])
          source_commit = os.environ["SOURCE_COMMIT"]
          chart = json.loads((directory / "codefactory-chart.json").read_text(encoding="utf-8"))
          images = {}
          for path in sorted(directory.glob("codefactory-image-*.json")):
              record = json.loads(path.read_text(encoding="utf-8"))
              if record.get("sourceCommit") != source_commit or record.get("service") in images:
                  raise SystemExit("Image manifest source or service identity mismatch")
              service = record["service"]
              if service not in {"gateway", "management", "supervisor", "worker"}:
                  raise SystemExit("Unexpected Code Factory image service")
              if not re.fullmatch(r"ghcr\.io/utopikprompt/codefactory-" + service + r"@sha256:[a-f0-9]{64}", record["image"]):
                  raise SystemExit("Image manifest is not pinned to an approved digest")
              images[service] = record["image"]
          expected = {"gateway", "management", "supervisor", "worker"}
          if set(images) != expected or chart.get("sourceCommit") != source_commit:
              raise SystemExit("Complete chart and all four image manifests are required")
          manifest = {
              "product": "codefactory",
              **chart,
              "images": images,
          }
          if (not re.fullmatch(r"[0-9a-f]{40}", source_commit)
                  or not re.fullmatch(r"sha256:[a-f0-9]{64}", manifest["chartDigest"])):
              raise SystemExit("Release manifest source or chart digest is invalid")
          (directory / "codefactory-release-manifest.json").write_text(
              json.dumps(manifest, sort_keys=True, indent=2) + "\n", encoding="utf-8",
          )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: codefactory-release-${{ github.sha }}
          path: ${{ runner.temp }}/codefactory-manifests/codefactory-release-manifest.json
          if-no-files-found: error
          retention-days: 90

  summary:
    name: CI Summary
    if: always()
    needs: [set-image-tag, lint, test, chart-validation, build-images]
    runs-on: ubuntu-latest
    steps:
      - name: Summarize pipeline
        env:
          TAG_RESULT: ${{ needs.set-image-tag.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          CHART_RESULT: ${{ needs.chart-validation.result }}
          BUILD_RESULT: ${{ needs.build-images.result }}
          IMAGE_TAG: ${{ needs.set-image-tag.outputs.tag }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          {
            printf '## CI Overview\n\n'
            printf '| Job | Result |\n| --- | --- |\n'
            printf '| Image tag | %s |\n' "$TAG_RESULT"
            printf '| Ruff lint | %s |\n' "$LINT_RESULT"
            printf '| Python tests | %s |\n' "$TEST_RESULT"
            printf '| Orchestrator chart | %s |\n' "$CHART_RESULT"
            printf '| Container builds (all services) | %s |\n\n' "$BUILD_RESULT"
            printf 'Commit: `%s`\n\n' "$GITHUB_SHA"
            printf '[Run logs and artifacts](%s/%s/actions/runs/%s)\n\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            if [[ "$BUILD_RESULT" == "success" ]]; then
              if [[ "$PUBLISH_IMAGES" == "true" ]]; then
                printf 'Images published with short-SHA tag `%s`, full-commit tag `%s`, and `latest`:\n\n' "$IMAGE_TAG" "$SOURCE_COMMIT"
              else
                printf 'Images built for validation only; nothing was published:\n\n'
              fi
              for service in supervisor worker gateway management; do
                printf -- '- `%s/utopikprompt/codefactory-%s:%s`\n' "$REGISTRY" "$service" "$IMAGE_TAG"
              done
            else
              printf 'Image builds did not all succeed. Check individual matrix jobs before deploying.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
